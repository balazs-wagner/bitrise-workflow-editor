# Shared across every client in the monorepo. Owned by the platform team.
step_bundles:
  checkout:
    summary: Clone the monorepo (sparse) at the triggering commit
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          inputs:
            - sparse_directories: |-
                packages/apps/field-app
                packages/infra
  install_node_deps:
    summary: Restore the yarn cache and install
    steps:
      - restore-npm-cache@2: {}
      - yarn@0:
          inputs:
            - workdir: $APP_ROOT
            - command: install --frozen-lockfile
  save_node_cache:
    steps:
      - save-npm-cache@1: {}
  notify_slack:
    summary: Post the result to the team channel
    steps:
      - slack@4:
          is_always_run: true
          inputs:
            - webhook_url: $SLACK_WEBHOOK_URL
            - channel: $SLACK_CHANNEL
